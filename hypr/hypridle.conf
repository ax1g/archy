# archy: Hyprland idle handling.
#
# Locks after four minutes of no input, dims first so the lock is not the first
# thing that appears, and blanks the outputs last.
#
# The lock surface and DPMS are handled separately on purpose. Cycling DPMS
# while a lock surface is up tears down every wl_output the compositor has,
# which Hyprland does not survive: it comes back with "no outputs, creating
# placeholder screen", then dies on the first eglSwapBuffers. So the outputs go
# off first and the lock surface comes up onto an already-dark screen.

# Fade to black, then lock.
listener {
    timeout = 240
    hyprlock
}

# Fade to black, blank, then lock, for a machine that is left alone longer.
listener {
    timeout = 900
    hyprlock
    dpms-off
    dpms-on
    hyprlock
}

# Suspend when the lid closes, or after a long idle on battery.
#
# The lid close is a switch event, not a timeout, so it is a separate listener
# tied to the lid. There is no clamshell profile here: archy-monitor-clamshell
# owns the internal display, and the lock is what actually protects the session.
