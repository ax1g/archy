# archy: hypridle configuration.
#
# This calls archy-lock, not hyprlock directly, because archy-lock is the one
# that loads the generated QML and that blanks the outputs *before* the lock
# surface comes up. Both matter:
#
# Cycling DPMS while a lock surface is up tears down every wl_output the
# compositor has, and Hyprland does not come back from that. It loses all
# outputs, makes a placeholder screen, then dies on the next eglSwapBuffers.
# The order is therefore always: outputs off, settle, surface on. Nothing here
# may blank the outputs while a lock is up.
#
# The command key is on-timeout, not exec. hypridle's listener blocks are
# timeout plus one or more of on-timeout, on-resume, on-idle. An unparseable
# config means no listeners at all, and the failure is a machine that simply
# never locks, with nothing in the logs.
#
# Absolute paths because ~/.local/bin is not guaranteed to be on the PATH
# hypridle hands to the shell.

# Idle for four minutes.
listener {
    timeout = 240
    on-timeout = $HOME/.local/bin/archy-lock
}

# Idle for fifteen minutes. A second listener rather than a longer timeout on
# the first, because hypridle fires each listener independently and the short
# one has already handled the session by then.
#
# This deliberately adds no dpms-off/dpms-on. An earlier version locked, then
# blanked, then re-enabled, then locked again, which is a DPMS cycle taken with
# the lock surface up.
listener {
    timeout = 900
    on-timeout = $HOME/.local/bin/archy-lock
}

# Suspend on lid close is left to systemd-logind, which already suspends on lid
# close by default. The lock for that case is the switch binding in
# bindings.lua, which calls loginctl lock-session, and the internal display is
# moved by archy-monitor-clamshell.
