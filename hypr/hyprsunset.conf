# hyprsunset configuration for archy.
#
# hyprsunset is how brightness and nightlight both work here. This panel rejects
# DDC/CI writes, so there is no hardware backlight to drive, and gamma at the
# compositor level is the only thing that dims it.
#
# The identity profile below is the daytime default: it does nothing, which is
# the correct starting state. archy-brightness sets gamma on top of it, and
# archy-nightlight-toggle swaps to the warm profile.

# Daytime: no tint at all.
profile {
    time = 07:00
    identity = true
}

# Night. Uncomment to make this automatic; archy-nightlight-toggle also
# switches to it on demand, so both can be in play at once.
#
# profile {
#     time = 20:00
#     temperature = 4000
# }
