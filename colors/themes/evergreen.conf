# archy — single source of truth for every color in the setup.
#
# This is the ONLY file you edit to change themes. Hyprland reads it directly
# (hypr/theme.lua), and scripts/archytheme reads the same file to regenerate the
# generated Waybar and Wofi stylesheets. Nothing else holds a color value.
#
# Format: key = value, one per line, '#' starts a comment. Values are plain
# hex (#rrggbb) or rgba(rrggbbaa). Keep it boring so both the Lua parser and
# the shell parser can read it.

name = evergreen
mode = dark

accent = #4a9a68
selection = #28302b
muted = #4a684a

background = #101913
dark_background = #0c130e
darker_background = #080d0a
lighter_background = #28302b

foreground = #a1af9c
dark_foreground = #798375
light_foreground = #afbbab
bright_foreground = #b9c3b5

red = #c87a5c
yellow = #c4a64e
orange = #d08e74
green = #6aae52
cyan = #52987a
blue = #4a9a68
magenta = #8a7856
brown = #7d5546

bright_red = #d89268
bright_yellow = #d4ba60
bright_green = #82c45a
bright_cyan = #48aa82
bright_blue = #5aae7a
bright_magenta = #a08e66

# Not a theme color: the compositor-inactive border. Kept neutral gray on
# purpose so the accent is the only thing that reads as "active".
inactive_border = rgba(595959aa)
