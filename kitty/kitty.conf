# archy: kitty.
#
# Your existing kitty.conf, unchanged except for line 3. Everything below it —
# the weight set, font_size 11.5, padding, keybindings, scrollback behaviour and
# cursor — is exactly what you had, and is deliberately not normalized.
#
# The one change: the theme include pointed into the Omarchy tree
# (~/.local/state/omarchy/current/theme/kitty.conf), which stops existing with
# Omarchy. It now points at generated/kitty.conf, which archy-theme writes from
# colors/colors.conf, so the terminal keeps following the theme like it did.
#
# Regenerate after a theme change:  archy-theme apply

include ~/.config/archy/generated/kitty.conf

# Font - JetBrainsMono ExtraLight (200): thin on low-DPI 1080p.
# Provided by ttf-jetbrains-mono-nerd, the full weight set. The -basic package
# that Omarchy pulled in carries only Regular/Bold/Italic/BoldItalic and has no
# ExtraLight face, which is why this config names the styles explicitly.
#
# Bold faces are named explicitly so bold stays a real face instead of being
# auto-synthesized by the renderer, which is visibly heavier and thinner.
font_family family="JetBrainsMono Nerd Font" style="ExtraLight"
italic_font family="JetBrainsMono Nerd Font" style="ExtraLight Italic"
bold_font family="JetBrainsMono Nerd Font" style="Bold"
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"
font_size 11.5

# Window
window_padding_width 4 8
hide_window_decorations yes
confirm_os_window_close 0
# Tiling WM (Hyprland/Wayland): window size is rarely an exact multiple of
# cell size. `resize_in_steps` is a no-op on Wayland, so the leftover padding
# is controlled by placement_strategy. `center` (default) splits it top/bottom
# which reads as a blank first line on resize; pin it to bottom/right instead.
resize_in_steps no
placement_strategy top-left
# SUPER+T floats to 1680x945 (usually an enlarge): pull scrollback into the
# new space instead of leaving blank rows.
scrollback_fill_enlarged_window yes

# Frosted glass handled by Hyprland (0.93 / 0.90) for consistency with all windows.
# Keep kitty itself opaque so it doesn't double-stack transparency.
background_opacity 1
dynamic_background_opacity no

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Fallback so SUPER+SHIFT+C/V copy/paste inside the terminal even if the
# Hyprland universal binding is eaten by the focused surface.
map super+shift+c copy_to_clipboard
map super+shift+v paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote access
allow_remote_control no
listen_on unix:${XDG_RUNTIME_DIR}/archy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
cursor_trail 1
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               hidden
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
