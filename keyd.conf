# archy: keyd — Caps Lock as Escape, with vim keys under it.
#
# keyd remaps keys at the kernel input layer, below Wayland and below every
# application. That is what makes this work in a fullscreen browser, in a
# terminal, in a game: nothing in the userspace stack can intercept it, so there
# is no window where Escape stops being Escape.
#
# The reason it is keyd and not a compositor remap: Hyprland can remap a key,
# but only for windows it manages, and a key that is held down when focus changes
# behaves differently than one remapped at the device level. The two are not
# equivalent, and the failure is a stuck modifier rather than a missing Escape.
#
# Installed to /etc/keyd/default.conf, which keyd reads at start. Re-read it with:
#     sudo keyd reload
#
# This file is installed by scripts/install.sh. It overwrites whatever is at
# /etc/keyd/default.conf, keeping a .bak, because a keymap that silently merges
# two configurations is worse than one that is replaced.

[ids]
# Every device. A per-device list would be the thing to narrow this to a
# keyboard, if the laptop's built-in keyboard and an external one ever needed
# different treatment.
*

[main]
# overload: holding Caps Lock gives the second map, tapping it gives the first.
#
# So Caps Lock is Escape on tap, which is what it was before this config
# existed, and vim keys while held. It is not a mode toggle: there is no state to
# get stuck, and a stuck modifier cannot survive a focus change because the
# state never exists.
capslock = overload(nav, esc)

[nav]
# Arrows under Caps Lock. These are the vim movement keys, so h/j/k/l move the
# cursor and Esc gets you out, which is the pairing that makes the rest of the
# config worth having.
h = left
j = down
k = up
l = right
